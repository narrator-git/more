<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with AI - more</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header has-logo">
        <a href="index.html" class="header-logo header-logo-visible">more</a>
        <nav class="nav">
            <a href="ai-chat.html" class="nav-link" data-i18n="nav.moreAI">more AI</a>
            <a href="therapist-selection.html" class="nav-link" data-i18n="nav.psychologists">Our psychologists</a>
            <a href="dashboard.html" class="nav-link" data-i18n="nav.dashboard">Dashboard</a>
        </nav>
    </header>

    <!-- AI Chat Section -->
    <section class="ai-chat-section">
        <div class="ai-chat-layout">
            <div class="ai-chat-main" id="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <!-- Messages will be rendered here -->
                </div>
                <div class="chat-input-section" id="chat-input-section">
                    <div class="chat-input-container">
                        <div class="chat-input-wrapper">
                            <input 
                                type="text" 
                                id="message-input" 
                                class="chat-input" 
                                data-i18n="chat.placeholder"
                                placeholder="Type your message here..."
                                autocomplete="off"
                            >
                            <button class="btn btn-primary chat-send-btn" id="send-btn" data-i18n="chat.send">Send</button>
                        </div>
                    </div>
                </div>
            </div>
            <aside class="ai-chat-sidebar" id="ai-chat-sidebar">
                <div class="sidebar-section sidebar-calendar" id="sidebar-calendar">
                    <h3 class="sidebar-title" data-i18n="chat.upcomingSessions">Upcoming Sessions</h3>
                    <div id="sidebar-calendar-content"><!-- Filled by JS --></div>
                </div>
                <div class="sidebar-section sidebar-notes" id="sidebar-notes">
                    <h3 class="sidebar-title" data-i18n="chat.notesTitle">Notes for your therapist</h3>
                    <p class="sidebar-hint" data-i18n="chat.notesHint">Things you want to discuss in your next session</p>
                    <textarea id="sidebar-notes-input" data-i18n="chat.notesPlaceholder" placeholder="e.g. I've been feeling more anxious at work..." rows="4"></textarea>
                    <button class="btn btn-primary btn-sm" id="sidebar-notes-save" data-i18n="chat.save">Save</button>
                </div>
            </aside>
        </div>
    </section>

    <!-- Modal Popup for Best Matches -->
    <div class="modal-overlay" id="modal-overlay" style="display: none;">
        <div class="modal-content best-matches-modal">
            <div class="modal-header-best-matches">
                <h2 class="modal-title" data-i18n="chat.bestMatches">Best Matches for You</h2>
                <button class="modal-close-btn" id="modal-close-btn">&times;</button>
            </div>
            <p class="modal-message" data-i18n="chat.modalMessage">Based on our conversation, here are therapists who are the best fit for you:</p>
            <div id="therapist-match-cards" class="therapist-match-cards-container">
                <!-- Therapist cards will be rendered here -->
            </div>
            <div class="modal-footer-best-matches">
                <button class="btn btn-primary modal-continue-btn" id="book-top-match-btn" style="display: none;" data-i18n="chat.bookSession">Book Session</button>
                <a href="therapist-selection.html" class="btn btn-outline modal-continue-btn" id="modal-continue-btn" data-i18n="chat.browseAll">Browse all therapists</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/accounts.js"></script>
    <script src="js/nav-auth.js"></script>
    <script src="js/ai-chat.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initI18n === 'function') initI18n();
        });
    </script>
</body>
</html>
