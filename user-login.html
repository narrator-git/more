<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - more</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <!-- Login Section -->
    <section class="login-section">
        <div class="login-lang-wrap" id="login-lang-wrap"></div>
        <div class="login-container">
            <div class="login-header">
                <a href="index.html" class="login-logo-link">
                    <h1 class="login-title">more</h1>
                </a>
                <p class="login-subtitle" data-i18n="auth.welcomeBack">Welcome back</p>
            </div>

            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label for="email" class="form-label" data-i18n="auth.email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        data-i18n="auth.placeholderEmail"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label" data-i18n="auth.password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        data-i18n="auth.placeholderPassword"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me" name="remember-me">
                        <span data-i18n="auth.rememberMe">Remember me</span>
                    </label>
                </div>

                <div class="form-error" id="form-error"></div>

                <button type="submit" class="btn btn-primary btn-login-submit" id="login-submit-btn">
                    <span data-i18n="auth.signIn">Sign In</span>
                </button>

                <div class="form-divider">
                    <span data-i18n="auth.noAccount">Don't have an account?</span>
                </div>

                <a href="user-register.html" class="btn btn-outline btn-register-link" data-i18n="auth.createAccountBtn">
                    Create Account
                </a>

                <div class="psychologist-link-container">
                    <a href="psychologist-login.html" class="psychologist-link" data-i18n="auth.psychologist">
                        I am a psychologist
                    </a>
                </div>
            </form>
        </div>
    </section>

    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/accounts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initI18nLogin === 'function') initI18nLogin('#login-lang-wrap');
            const form = document.getElementById('login-form');
            const errorDiv = document.getElementById('form-error');
            const submitBtn = document.getElementById('login-submit-btn');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                errorDiv.textContent = '';
                errorDiv.style.display = 'none';
                
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    showError('Please fill in all fields');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Signing in...';

                try {
                    const result = await AuthAPI.login(email, password);
                    if (result.token) {
                        if (typeof AccountManager !== 'undefined') {
                            AccountManager.clearLoggedOutFlag();
                        }
                        window.location.href = 'ai-chat.html';
                    }
                } catch (error) {
                    let errorMsg = 'Login failed. Please check your credentials.';
                    if (error.status === 404) {
                        errorMsg = 'Server not found. Please make sure the server is running (npm start).';
                    } else if (error.status === 401) {
                        errorMsg = 'Invalid email or password.';
                    } else if (error.data && error.data.error) {
                        errorMsg = error.data.error;
                    }
                    showError(errorMsg);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            });

            function showError(message) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
